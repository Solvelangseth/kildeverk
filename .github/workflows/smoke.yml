name: live smoke test
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest -m live
        env:
          KILDEVERK_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          KILDEVERK_FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          KILDEVERK_NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
