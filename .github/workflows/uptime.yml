name: uptime
# Every 15 minutes: is the hosted service up, and does MCP answer? A failed run makes
# GitHub email the repository owner, which is the outage alert.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 https://kildeverk.fly.dev/healthz
      - name: MCP lists its tools
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -X POST https://kildeverk.fly.dev/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"tools"'
