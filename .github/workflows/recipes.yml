name: refresh recipes
# Re-runs the website's worked questions live each week and opens a pull request with the
# new figures, so the site never shows stale answers without anyone noticing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python scripts/build_recipes.py
        env:
          KILDEVERK_CONTACT: ${{ vars.KILDEVERK_CONTACT || 'https://github.com/Solvelangseth/kildeverk' }}
          KILDEVERK_CACHE_PATH: /tmp/kildeverk.sqlite
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh-recipes
          commit-message: "Refresh website recipes"
          title: "Refresh website recipes"
          body: "Weekly re-run of `scripts/build_recipes.py`. Review the new figures before merging."
          add-paths: src/kildeverk/recipes.json
