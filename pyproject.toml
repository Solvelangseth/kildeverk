[project]
name = "kildeverk"
version = "0.2.0"
description = "Live Norwegian public data for AI agents and people: an MCP server and a JSON API with provenance on every result."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sølve Langseth" }]
dependencies = [
  "mcp>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.scripts]
kildeverk = "kildeverk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls real upstream APIs; excluded from CI (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
